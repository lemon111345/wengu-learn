# 本地开发用的 MySQL：docker compose up -d
# 账号密码只用于本机开发，与 application.yml 中的默认值一致。#24 会在这里加入后端、前端和 Nginx
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wengu
      MYSQL_USER: wengu
      MYSQL_PASSWORD: wengu
      MYSQL_ROOT_PASSWORD: wengu-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
