# 前端容器中的 Nginx（#24，决策 036）：提供打包后的页面，并把 /api 转给后端容器

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 上传的文件最大 10 MB（#26）。这里和后端的 spring.servlet.multipart.max-request-size 一样放到 11 MB：
    # 10～11 MB 的由后端返回统一格式的提示；再大的 Nginx 直接拒绝，也返回统一格式，否则前端只能显示“服务暂时不可用”
    client_max_body_size 11m;
    error_page 413 = @too_large;

    location @too_large {
        default_type application/json;
        return 413 '{"code":"BAD_REQUEST","message":"文件不能超过 10 MB","data":null}';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 学习对话是流式输出（SSE）：不缓冲，收到一段就转发一段，否则老师的回复会攒到最后才出现
        proxy_buffering off;
        proxy_cache off;
        # 和后端的异步请求超时（spring.mvc.async.request-timeout）一致
        proxy_read_timeout 600s;
    }

    # 打包后的文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由：刷新 /library 等页面时回落到 index.html；index.html 本身不缓存，升级后立刻生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
