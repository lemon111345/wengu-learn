<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>温故 知识库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FB2}a:hover{color:#16507F}
</style>
</helmet>
<div style="font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1C1D21; background: #FFFFFF; min-height: 1250px; display: flex; flex-wrap: wrap">
<nav aria-label="主导航" style="flex: 1 1 232px; max-width: 248px; box-sizing: border-box; padding: 22px 16px; background: #F6F7F9; border-right: 1px solid #E4E6EA; display: flex; flex-direction: column; gap: 28px">
<span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 24px; font-weight: 700; letter-spacing: 5px; padding: 0 12px">温故</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: {{n.bg}}; color: {{n.color}}; font-size: 15px; font-weight: {{n.weight}}; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
{{n.label}}
</a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 10px">
<span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #E7F0F9; color: #1F6FB2; font-size: 15px; font-weight: 700">张</span>
<span style="font-size: 14px; font-weight: 700">张同学</span>
</div>
</nav>
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 40px; border-bottom: 1px solid #E4E6EA">
<h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px; font-weight: 700">知识库</h1>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<label for="kb-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索知识点</label>
<input id="kb-search" type="search" placeholder="搜索知识点" style="min-height: 44px; width: 240px; padding: 0 12px; border: 1px solid #E4E6EA; border-radius: 8px; font: inherit; font-size: 14px; color: #1C1D21">
<a href="Import-v3.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #E7F0F9; color: #1F6FB2; font-size: 14px; font-weight: 700; text-decoration: none">导入资料</a>
</div>
</header>
<div style="width: 100%; max-width: 1400px; margin: 0 auto; padding: 24px 40px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<main style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<div role="group" aria-label="按掌握程度筛选" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 1px solid {{c.border}}; border-radius: 999px; background: {{c.bg}}; font: inherit; font-size: 14px; font-weight: {{c.weight}}; color: #1C1D21; cursor: pointer">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}; box-shadow: {{c.dotRing}}"></span>{{c.label}}<span style="color: #5F636B">{{c.n}}</span>
</button>
</sc-for>
</div>
<label for="kb-type" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">按类型筛选</label>
<select id="kb-type" value="{{typeFilter}}" onChange="{{onTypeFilter}}" style="min-height: 40px; padding: 0 10px; border: 1px solid {{typeBorder}}; border-radius: 999px; background: {{typeBg}}; font: inherit; font-size: 14px; color: #1C1D21">
<option>全部类型</option><option>原子概念</option><option>对比</option><option>原理机制</option><option>列举</option><option>排查实战</option><option>系统设计</option><option>个人经历</option>
</select>
</div>
<sc-if value="{{hasChecked}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 8px 8px 8px 18px; background: #E7F0F9; border-radius: 10px">
<span style="font-size: 14px; font-weight: 700; color: #1F6FB2">已选 {{checkedCount}} 个</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 40px; padding: 0 14px; border: 1px solid #C6D9EE; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: {{mergeColor}}; cursor: pointer">合并</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border: 1px solid #C6D9EE; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #1C1D21; cursor: pointer">暂停复习</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border: 1px solid #C6D9EE; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #C2410C; cursor: pointer">删除</button>
<button type="button" onClick="{{clearChecked}}" style="min-height: 40px; padding: 0 10px; border: none; background: transparent; font: inherit; font-size: 14px; color: #5F636B; cursor: pointer">取消选择</button>
</div>
</div>
</sc-if>
<section style="border: 1px solid #E4E6EA; border-radius: 14px; overflow-x: auto">
<div style="min-width: 640px">
<div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 96px 76px 100px; align-items: center; padding: 0 16px 0 4px; min-height: 44px; border-bottom: 1px solid #E4E6EA; font-size: 13px; color: #5F636B">
<span></span>
<sc-for list="{{heads}}" as="h" hint-placeholder-count="4">
<button type="button" onClick="{{h.pick}}" aria-label="{{h.aria}}" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: none; background: transparent; font: inherit; font-size: 13px; font-weight: {{h.weight}}; color: {{h.color}}; cursor: {{h.cursor}}; text-align: left">{{h.label}}<span aria-hidden="true">{{h.arrow}}</span></button>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 96px 76px 100px; align-items: center; padding: 0 16px 0 4px; min-height: 52px; border-bottom: 1px solid #EEF0F3; background: {{r.rowBg}}">
<label style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; cursor: pointer"><input type="checkbox" checked="{{r.checked}}" onChange="{{r.toggle}}" aria-label="{{r.aria}}" style="width: 17px; height: 17px; accent-color: #1F6FB2"></label>
<button type="button" onClick="{{r.select}}" style="min-height: 44px; padding: 0 8px 0 0; border: none; background: transparent; text-align: left; font: inherit; font-size: 15px; font-weight: {{r.weight}}; color: {{r.color}}; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</button>
<span style="font-size: 13px; color: #5F636B">{{r.type}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}; box-shadow: {{r.dotRing}}"></span>{{r.state}}</span>
<span style="font-size: 14px; color: {{r.nextColor}}">{{r.next}}</span>
</div>
</sc-for>
</div>
</section>
<span style="font-size: 14px; color: #5F636B">{{footText}}</span>
</main>
<aside aria-label="知识点详情" style="flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column; gap: 18px; padding: 24px; border: 1px solid #E4E6EA; border-radius: 14px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5F636B"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{sel.dot}}; box-shadow: {{sel.dotRing}}"></span>{{sel.state}}<span style="margin-left: auto">{{sel.nextLabel}}</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="d-title" style="font-size: 14px; font-weight: 700">标题</label>
<textarea id="d-title" rows="2" style="padding: 10px 12px; border: 1px solid #D5D8DD; border-radius: 8px; resize: vertical; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 17px; font-weight: 700; line-height: 1.5; color: #1C1D21" value="{{sel.title}}" onChange="{{onTitle}}"></textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="d-type" style="font-size: 14px; font-weight: 700">类型</label>
<select id="d-type" value="{{sel.type}}" onChange="{{onType}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #D5D8DD; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1C1D21">
<option>原子概念</option><option>对比</option><option>原理机制</option><option>列举</option><option>排查实战</option><option>系统设计</option><option>个人经历</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
<label for="d-sum" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">要点<span style="font-size: 12px; font-weight: 400; color: {{sel.badgeColor}}; background: {{sel.badgeBg}}; padding: 1px 8px; border-radius: 999px">{{sel.badge}}</span></label>
<sc-if value="{{sel.edited}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{restoreSummary}}" style="min-height: 32px; padding: 0 4px; border: none; background: transparent; font: inherit; font-size: 13px; color: #1F6FB2; cursor: pointer">恢复 AI 版本</button>
</sc-if>
</div>
<textarea id="d-sum" rows="5" style="padding: 10px 12px; border: 1px solid #D5D8DD; border-radius: 8px; resize: vertical; font: inherit; font-size: 15px; line-height: 1.75; color: #1C1D21" value="{{sel.summary}}" onChange="{{onSummary}}"></textarea>
<span style="font-size: 13px; line-height: 1.7; color: #5F636B">要点是评分的标准，由 AI 根据原题写成，可能有遗漏或错误。手上有参考答案的话，可以照着改；不要为了好过而删掉难的部分。</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E4E6EA">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">学习记录</h2>
<sc-for list="{{sel.history}}" as="h" hint-placeholder-count="2">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px"><span style="color: #5F636B">{{h.date}}</span><span>{{h.text}}</span></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">来源</h2>
<span style="color: #5F636B; line-height: 1.6">{{sel.source}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 16px; border-top: 1px solid #E4E6EA">
<button type="button" style="min-height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #E7F0F9; color: #1F6FB2; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">保存修改</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #D5D8DD; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1C1D21; cursor: pointer">{{sel.pauseLabel}}</button>
<button type="button" style="min-height: 44px; padding: 0 10px; margin-left: auto; border: none; background: transparent; font: inherit; font-size: 15px; color: #C2410C; cursor: pointer">删除</button>
</div>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: '全部', typeFilter: '全部类型', sortKey: 'order', sortDir: 1, selected: 1, checked: [], edits: {} };
  }
  renderVals() {
    const icons = {
      today: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',
      book: 'M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4zM5 16a4 4 0 0 1 4-4h10',
      inbox: 'M4 13l2.5-7h11l2.5 7v6H4zM4 13h5l1 2h4l1-2h5',
      sliders: 'M5 6h14M5 12h14M5 18h14M9 4v4M15 10v4M11 16v4'
    };
    const nav = [['今天', 'today', 'B-Today-v3.dc.html'], ['知识库', 'book', 'Library-v3.dc.html'], ['导入资料', 'inbox', 'Import-v3.dc.html'], ['设置', 'sliders', 'Settings-v3.dc.html']].map(([label, key, href], i) => ({
      label, href, icon: icons[key],
      bg: i === 1 ? '#E7F0F9' : 'transparent',
      color: i === 1 ? '#1F6FB2' : '#1C1D21',
      weight: i === 1 ? 700 : 400
    }));
    const stateStyle = {
      '牢固': ['#1F6FB2', 'none'], '熟悉': ['#7FB0DD', 'none'], '一般': ['#E8A100', 'none'], '生疏': ['#D9480F', 'none'],
      '待学': ['#C9CDD3', 'none'], '暂停': ['transparent', 'inset 0 0 0 1.5px #8A9099'], '暂不支持': ['transparent', 'inset 0 0 0 1.5px #C9CDD3']
    };
    const src1 = 'Java 后端面试题（第一批）';
    const data = [
      ['HashMap 的底层数据结构是怎样的？', '原理机制', '牢固', '11月22日', '数组加链表，JDK 1.8 起链表过长且数组足够大时转为红黑树。', src1 + '，第 1 题'],
      ['HashMap 的扩容机制是怎样的？', '原理机制', '熟悉', '11月7日', '元素个数超过阈值（容量乘以负载因子，默认 12）时扩容，容量翻倍；迁移时看 hash 和旧容量做与运算的结果，留在原位或移到原下标加旧容量，桶内节点拆成两条链表并保持顺序。', src1 + '，第 1 题'],
      ['为什么 JDK 1.8 的 HashMap 要引入红黑树？', '原理机制', '一般', '11月3日', '冲突严重时链表查找退化为 O(n)，红黑树是 O(log n)。', src1 + '，第 1、9 题'],
      ['HashMap 和 Hashtable 有什么区别？', '对比', '熟悉', '11月9日', '线程安全性、null 键值、性能三方面的差异。', src1 + '，第 2 题'],
      ['ConcurrentHashMap 是怎么保证线程安全的？', '原理机制', '生疏', '明天', 'JDK 1.8 用 CAS 加 synchronized 锁住桶的头节点。', src1 + '，第 3、12 题'],
      ['volatile 的作用是什么？', '原子概念', '牢固', '12月2日', '可见性与禁止指令重排，不保证复合操作的原子性。', src1 + '，第 4 题'],
      ['synchronized 和 ReentrantLock 有什么区别？', '对比', '一般', '11月2日', '实现层面、可中断、公平锁、条件变量等方面的差异。', src1 + '，第 5 题'],
      ['为什么 HashMap 的容量必须是 2 的幂？', '原理机制', '待学', '', '让 hash & (n − 1) 等价于取模，并支撑扩容时的迁移规则。', '接着问：HashMap 的扩容机制是怎样的？'],
      ['Spring Boot 的启动流程是怎样的？', '原理机制', '待学', '', '从 SpringApplication.run 到容器刷新完成的主要步骤。', 'Spring 面试题'],
      ['Redis 的持久化方式有哪些？', '列举', '熟悉', '11月12日', 'RDB、AOF 以及混合持久化。', 'Redis 高频题'],
      ['什么是缓存击穿，怎么解决？', '原理机制', '暂停', '', '热点 key 过期瞬间大量请求打到数据库；互斥锁或逻辑过期。', 'Redis 高频题'],
      ['设计一个秒杀系统', '系统设计', '暂不支持', '', '限流、缓存预热、库存扣减、异步下单、防重复提交。', src1 + '，第 41 题']
    ];
    const counts = { '全部': 86, '牢固': 9, '熟悉': 14, '一般': 12, '生疏': 6, '待学': 39, '暂停': 2, '暂不支持': 4 };
    const filter = this.state.filter;
    const chips = Object.keys(counts).map((label) => {
      const on = filter === label;
      const st = stateStyle[label] ?? ['#1C1D21', 'none'];
      return {
        label, n: counts[label],
        dot: label === '全部' ? 'transparent' : st[0],
        dotRing: label === '全部' ? 'inset 0 0 0 1.5px #1C1D21' : st[1],
        pressed: on ? 'true' : 'false',
        border: on ? '#1F6FB2' : '#E4E6EA',
        bg: on ? '#E7F0F9' : '#FFFFFF',
        weight: on ? 700 : 400,
        pick: () => this.setState({ filter: label })
      };
    });
    const checked = this.state.checked;
    const typeFilter = this.state.typeFilter;
    const rank = { '生疏': 0, '一般': 1, '熟悉': 2, '牢固': 3, '待学': 4, '暂停': 5, '暂不支持': 6 };
    const dateKey = (n) => {
      if (!n) return 9999;
      if (n === '明天') return 341;
      const m = n.match(/(\d+)月(\d+)日/);
      return m ? (Number(m[1]) * 31 + Number(m[2])) : 9999;
    };
    const { sortKey, sortDir } = this.state;
    let visible = data.map((d, i) => ({ d, i }))
      .filter(({ d }) => filter === '全部' || d[2] === filter)
      .filter(({ d }) => typeFilter === '全部类型' || d[1] === typeFilter);
    if (sortKey === 'mastery') visible.sort((a, b) => (rank[a.d[2]] - rank[b.d[2]]) * sortDir || a.i - b.i);
    if (sortKey === 'next') visible.sort((a, b) => (dateKey(a.d[3]) - dateKey(b.d[3])) * sortDir || a.i - b.i);
    const headDefs = [['order', '知识点（按学习顺序）', true], ['type', '类型', false], ['mastery', '掌握', true], ['next', '下次复习', true]];
    const heads = headDefs.map(([key, label, sortable]) => {
      const on = sortable && sortKey === key;
      return {
        label,
        arrow: on && key !== 'order' ? (sortDir === 1 ? '↑' : '↓') : '',
        aria: sortable ? '按' + label + '排序' : label,
        weight: on ? 700 : 400,
        color: on ? '#1C1D21' : '#5F636B',
        cursor: sortable ? 'pointer' : 'default',
        pick: () => {
          if (!sortable) return;
          if (this.state.sortKey === key && key !== 'order') this.setState({ sortDir: -this.state.sortDir });
          else this.setState({ sortKey: key, sortDir: 1 });
        }
      };
    });
    const rows = visible.map(({ d, i }) => {
      const [title, type, state, next] = d;
      const st = stateStyle[state];
      const isSel = this.state.selected === i;
      const isChecked = checked.includes(i);
      const nextText = state === '待学' ? '等待学习' : state === '暂停' ? '已暂停' : state === '暂不支持' ? '以后支持' : next;
      return {
        title, type, state,
        next: nextText,
        nextColor: next === '明天' ? '#C2410C' : (next ? '#1C1D21' : '#5F636B'),
        dot: st[0], dotRing: st[1],
        weight: isSel ? 700 : 400,
        color: '#1C1D21',
        rowBg: isSel ? '#F6F7F9' : (isChecked ? '#F3F7FC' : '#FFFFFF'),
        checked: isChecked,
        aria: '选择：' + title,
        toggle: () => {
          const cur = this.state.checked;
          this.setState({ checked: cur.includes(i) ? cur.filter((x) => x !== i) : cur.concat([i]) });
        },
        select: () => this.setState({ selected: i })
      };
    });
    const selIdx = this.state.selected;
    const s = data[selIdx];
    const ed = this.state.edits[selIdx] ?? {};
    const setEdit = (k, v) => this.setState({ edits: { ...this.state.edits, [selIdx]: { ...(this.state.edits[selIdx] ?? {}), [k]: v } } });
    const sst = stateStyle[s[2]];
    const history = s[2] === '待学' ? [{ date: '10月29日', text: '从接着问加入' }] :
      s[2] === '暂不支持' ? [{ date: '10月21日', text: '导入。系统设计题以后会用模拟面试的方式学' }] :
      s[2] === '暂停' ? [{ date: '10月24日', text: '新学，困难' }, { date: '10月27日', text: '暂停复习' }] :
      [{ date: '10月30日', text: '新学，良好（AI 建议：良好）' }];
    const edited = ed.summary !== undefined && ed.summary !== s[4];
    const sel = {
      edited,
      badge: edited ? '你改过' : 'AI 生成',
      badgeColor: edited ? '#1F6FB2' : '#5F636B',
      badgeBg: edited ? '#E7F0F9' : '#EEF0F3',
      title: ed.title ?? s[0], type: ed.type ?? s[1], state: s[2], summary: ed.summary ?? s[4], source: s[5],
      dot: sst[0], dotRing: sst[1],
      nextLabel: s[3] ? '下次复习：' + s[3] : '',
      history,
      pauseLabel: s[2] === '暂停' ? '恢复复习' : '暂停复习'
    };
    return {
      nav, chips, rows, sel,
      heads,
      typeFilter,
      typeBorder: typeFilter === '全部类型' ? '#E4E6EA' : '#1F6FB2',
      typeBg: typeFilter === '全部类型' ? '#FFFFFF' : '#E7F0F9',
      onTypeFilter: (e) => this.setState({ typeFilter: e.target.value }),
      restoreSummary: () => setEdit('summary', s[4]),
      footText: '显示 ' + rows.length + ' 个，共 86 个' + (filter !== '全部' || typeFilter !== '全部类型' ? '（已筛选）' : ''),
      onTitle: (e) => setEdit('title', e.target.value),
      onSummary: (e) => setEdit('summary', e.target.value),
      onType: (e) => setEdit('type', e.target.value),
      shown: rows.length,
      hasChecked: checked.length > 0,
      checkedCount: checked.length,
      mergeColor: checked.length >= 2 ? '#1C1D21' : '#9AA0A8',
      clearChecked: () => this.setState({ checked: [] })
    };
  }
}
</script>
</body>
</html>
