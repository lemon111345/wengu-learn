<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>温故 设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FB2}a:hover{color:#16507F}
</style>
</helmet>
<div style="font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1C1D21; background: #FFFFFF; min-height: 1000px; display: flex; flex-wrap: wrap">
<nav aria-label="主导航" style="flex: 1 1 232px; max-width: 248px; box-sizing: border-box; padding: 22px 16px; background: #F6F7F9; border-right: 1px solid #E4E6EA; display: flex; flex-direction: column; gap: 28px">
<span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 24px; font-weight: 700; letter-spacing: 5px; padding: 0 12px">温故</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: {{n.bg}}; color: {{n.color}}; font-size: 15px; font-weight: {{n.weight}}; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
{{n.label}}
</a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 10px">
<span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #E7F0F9; color: #1F6FB2; font-size: 15px; font-weight: 700">张</span>
<span style="font-size: 14px; font-weight: 700">张同学</span>
</div>
</nav>
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 40px; min-height: 44px; border-bottom: 1px solid #E4E6EA">
<h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px; font-weight: 700">设置</h1>
<span role="status" style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5F636B"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"></path></svg>{{savedText}}</span>
</header>
<div style="width: 100%; max-width: 1400px; margin: 0 auto; padding: 32px 40px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 24px">
<section style="display: flex; flex-direction: column; gap: 22px; padding: 28px; border: 1px solid #E4E6EA; border-radius: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">学习安排</h2>
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700">每天新学</span>
<span style="font-size: 14px; color: #5F636B">按现在的待学数量，还要 {{days}} 天学完</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="减少一个" onClick="{{dec}}" style="width: 44px; height: 44px; border: 1px solid #E4E6EA; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 20px; color: #1C1D21; cursor: pointer">−</button>
<span style="font-size: 22px; font-weight: 700; min-width: 32px; text-align: center">{{limit}}</span>
<button type="button" aria-label="增加一个" onClick="{{inc}}" style="width: 44px; height: 44px; border: 1px solid #E4E6EA; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 20px; color: #1C1D21; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 20px; border-top: 1px solid #EEF0F3">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 300px">
<label for="day-start" style="font-size: 15px; font-weight: 700">新的一天从几点开始</label>
<span style="font-size: 14px; line-height: 1.6; color: #5F636B">在这之前学的，算前一天。熬夜学习的话可以调晚一点。</span>
</div>
<select id="day-start" style="min-height: 44px; min-width: 120px; padding: 0 10px; border: 1px solid #D5D8DD; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1C1D21">
<option>凌晨 0 点</option><option>凌晨 2 点</option><option selected>凌晨 4 点</option><option>凌晨 6 点</option>
</select>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 20px; border-top: 1px solid #EEF0F3">
<label for="tz" style="font-size: 15px; font-weight: 700">时区</label>
<select id="tz" style="min-height: 44px; min-width: 220px; padding: 0 10px; border: 1px solid #D5D8DD; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1C1D21">
<option selected>中国标准时间（UTC+8）</option><option>日本标准时间（UTC+9）</option><option>英国时间（UTC+0）</option>
</select>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 16px; padding: 28px; border: 1px solid #E4E6EA; border-radius: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">老师</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="tutor" style="font-size: 15px; font-weight: 700">称呼</label>
<input id="tutor" type="text" value="{{tutor}}" onChange="{{onTutor}}" style="min-height: 44px; max-width: 280px; padding: 0 12px; border: 1px solid #D5D8DD; border-radius: 8px; font: inherit; font-size: 15px; color: #1C1D21">
<span style="font-size: 14px; color: #5F636B">对话里会显示为“{{tutor}}”，讲解方式不变。</span>
</div>
</section>
</div>
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 24px">
<section style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border: 1px solid #E4E6EA; border-radius: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">账户</h2>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px"><span style="color: #5F636B">用户名</span><span>张同学</span></div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid #EEF0F3">
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #D5D8DD; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1C1D21; cursor: pointer">修改密码</button>
<a href="Setup-v3.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; margin-left: auto; color: #C2410C; font-size: 15px; text-decoration: none">退出登录</a>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px; padding: 28px; border: 1px solid #E4E6EA; border-radius: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">AI 模型</h2>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px">
<span>deepseek-flash</span>
<span style="display: flex; align-items: center; gap: 8px; color: #5F636B"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2B8A3E"></span>正常</span>
</div>
<span style="font-size: 14px; color: #5F636B">最近一次调用：10 分钟前，成功</span>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 1px solid #E4E6EA; border-radius: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">快捷键</h2>
<sc-for list="{{keys}}" as="k" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 32px; font-size: 14px">
<span style="color: #5F636B">{{k.label}}</span>
<kbd style="font: inherit; font-size: 13px; padding: 2px 8px; border: 1px solid #D5D8DD; border-bottom-width: 2px; border-radius: 5px; background: #FFFFFF">{{k.key}}</kbd>
</div>
</sc-for>
</section>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { limit: 3, tutor: '老师', saved: false };
  }
  renderVals() {
    const icons = {
      today: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',
      book: 'M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4zM5 16a4 4 0 0 1 4-4h10',
      inbox: 'M4 13l2.5-7h11l2.5 7v6H4zM4 13h5l1 2h4l1-2h5',
      sliders: 'M5 6h14M5 12h14M5 18h14M9 4v4M15 10v4M11 16v4'
    };
    const nav = [['今天', 'today', 'B-Today-v3.dc.html'], ['知识库', 'book', 'Library-v3.dc.html'], ['导入资料', 'inbox', 'Import-v3.dc.html'], ['设置', 'sliders', 'Settings-v3.dc.html']].map(([label, key, href], i) => ({
      label, href, icon: icons[key],
      bg: i === 3 ? '#E7F0F9' : 'transparent',
      color: i === 3 ? '#1F6FB2' : '#1C1D21',
      weight: i === 3 ? 700 : 400
    }));
    const keys = [
      ['开始学习、进入下一个', 'Enter'],
      ['发送回答', 'Ctrl Enter'],
      ['评分', '1 2 3 4'],
      ['从接着问返回', 'Esc'],
      ['搜索知识点', 'Ctrl K'],
      ['查看全部快捷键', '?']
    ].map(([label, key]) => ({ label, key }));
    const limit = this.state.limit;
    const tutor = this.state.tutor || '老师';
    return {
      nav, keys, limit, tutor,
      days: Math.ceil(39 / limit),
      savedText: this.state.saved ? '已保存' : '修改后自动保存',
      dec: () => this.setState({ limit: Math.max(1, this.state.limit - 1), saved: true }),
      inc: () => this.setState({ limit: Math.min(20, this.state.limit + 1), saved: true }),
      onTutor: (e) => this.setState({ tutor: e.target.value, saved: true })
    };
  }
}
</script>
</body>
</html>
