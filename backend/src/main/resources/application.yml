spring:
  application:
    name: wengu
  ai:
    openai:
      # 兼容 OpenAI 格式的大模型。三项都只从环境变量读取，配置方式见 README。
      # base-url 原样使用（Spring AI 2.0 不会自动补 /v1）：DeepSeek 为 https://api.deepseek.com，OpenAI 为 https://api.openai.com/v1
      base-url: ${WENGU_LLM_BASE_URL:https://api.deepseek.com}
      # 默认为空：没有 Key 时应用照常启动，调用模型时才失败。
      # 显式给出值，也避免 Spring AI 隐式读取 OPENAI_API_KEY 环境变量
      api-key: ${WENGU_LLM_API_KEY:}
      # 单次请求超时。Spring AI 默认 60 秒，知识点抽取等长输出在较强的模型上会超时
      timeout: ${WENGU_LLM_TIMEOUT:180s}
      chat:
        options:
          model: ${WENGU_LLM_MODEL:deepseek-flash}

server:
  port: 8080
