spring:
  application:
    name: wengu
  datasource:
    # 默认连接仓库根目录 compose.yaml 启动的 MySQL。connectionTimeZone=UTC：Instant 按 UTC 写入 DATETIME，见决策 009
    url: ${WENGU_DB_URL:jdbc:mysql://localhost:3307/wengu?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${WENGU_DB_USERNAME:wengu}
    password: ${WENGU_DB_PASSWORD:wengu}
  flyway:
    placeholders:
      # 默认用户的时区，只在第一次建库时写入 user_settings
      default_timezone: ${WENGU_TIMEZONE:Asia/Shanghai}
  task:
    execution:
      # 定义了抽取线程池（ExtractionExecutorConfig）后，仍然创建 Spring Boot 默认的 applicationTaskExecutor
      mode: force
  ai:
    openai:
      # 兼容 OpenAI 格式的大模型。三项都只从环境变量读取，配置方式见 README。
      # base-url 原样使用（Spring AI 2.0 不会自动补 /v1）：DeepSeek 为 https://api.deepseek.com，OpenAI 为 https://api.openai.com/v1
      base-url: ${WENGU_LLM_BASE_URL:https://api.deepseek.com}
      # 默认为空：没有 Key 时应用照常启动，调用模型时才失败。
      # 显式给出值，也避免 Spring AI 隐式读取 OPENAI_API_KEY 环境变量
      api-key: ${WENGU_LLM_API_KEY:}
      # 单次请求超时。Spring AI 默认 60 秒，知识点抽取、长资料切分会超时。
      # 只配在这里不起作用，LlmService 每次请求都显式带上它（见决策 005 修订）
      timeout: ${WENGU_LLM_TIMEOUT:180s}
      # 关掉 SDK 的自动重试：超时也会被重发，每次重发都要计费，等待时间也成倍增加。要不要重试由业务代码决定
      max-retries: 0
      chat:
        options:
          model: ${WENGU_LLM_MODEL:deepseek-flash}

server:
  port: 8080
