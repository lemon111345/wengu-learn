spring:
  application:
    name: wengu
  datasource:
    # 默认连接仓库根目录 compose.yaml 启动的 MySQL。connectionTimeZone=UTC：Instant 按 UTC 写入 DATETIME，见决策 009
    url: ${WENGU_DB_URL:jdbc:mysql://localhost:3307/wengu?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${WENGU_DB_USERNAME:wengu}
    password: ${WENGU_DB_PASSWORD:wengu}
  session:
    # 必须显式配置：只配 server.servlet.session.timeout 对 Spring Session 不生效，Redis 中的 TTL 是默认的 30 分钟
    timeout: ${server.servlet.session.timeout}
  data:
    redis:
      # 登录状态存在这里（决策 040）。默认连接仓库根目录 compose.yaml 启动的 Redis
      host: ${WENGU_REDIS_HOST:localhost}
      port: ${WENGU_REDIS_PORT:6380}
  flyway:
    placeholders:
      # V1 插入默认用户时用的时区。V1 已经执行过的库不再用到它；空库仍然从 V1 开始执行，所以要保留
      default_timezone: ${wengu.default-timezone}
  servlet:
    multipart:
      # 上传资料的大小上限（#26），和 DocumentTextExtractor.MAX_FILE_SIZE、Nginx 的 client_max_body_size 一致；
      # 超过时由全局异常处理器返回“文件不能超过 10 MB”
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      # 流式回复（SSE）是异步请求，默认超时跟随 Tomcat，约 30 秒，老师的一条长回复会被中途切断。
      # 要比模型的单次请求超时（WENGU_LLM_TIMEOUT）长；超时只断开连接，回复照常在后台生成、存库（决策 025）
      request-timeout: 10m
  task:
    execution:
      # 定义了抽取线程池（ExtractionExecutorConfig）后，仍然创建 Spring Boot 默认的 applicationTaskExecutor
      mode: force
  ai:
    openai:
      # 兼容 OpenAI 格式的大模型。三项都只从环境变量读取，配置方式见 README。
      # base-url 原样使用（Spring AI 2.0 不会自动补 /v1）：DeepSeek 为 https://api.deepseek.com，OpenAI 为 https://api.openai.com/v1
      base-url: ${WENGU_LLM_BASE_URL:https://api.deepseek.com}
      # 默认为空：没有 Key 时应用照常启动，调用模型时才失败。
      # 显式给出值，也避免 Spring AI 隐式读取 OPENAI_API_KEY 环境变量
      api-key: ${WENGU_LLM_API_KEY:}
      # 单次请求超时。Spring AI 默认 60 秒，知识点抽取、长资料切分会超时。
      # 只配在这里不起作用，LlmService 每次请求都显式带上它（见决策 005 修订）
      timeout: ${WENGU_LLM_TIMEOUT:180s}
      # 关掉 SDK 的自动重试：超时也会被重发，每次重发都要计费，等待时间也成倍增加。要不要重试由业务代码决定
      max-retries: 0
      chat:
        options:
          model: ${WENGU_LLM_MODEL:deepseek-flash}

wengu:
  auth:
    # 是否开放注册（决策 017）。默认开放，否则自部署的人注册不了第一个账号；注册完自己后可以关掉
    allow-registration: ${WENGU_ALLOW_REGISTRATION:true}
  # 注册时读不到浏览器时区，或者它不合法时使用
  default-timezone: ${WENGU_TIMEZONE:Asia/Shanghai}

server:
  port: 8080
  servlet:
    session:
      # 登录凭证是服务端 Session（决策 022、040）。默认 30 分钟不操作就失效，每天打开都要重新登录，改为 30 天
      timeout: 30d
      cookie:
        # 跨站的页面发起的 POST 不带这个 Cookie，和 CSRF 令牌一起防伪造请求
        same-site: lax
