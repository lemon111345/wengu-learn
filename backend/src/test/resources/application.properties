# 普通测试不用 Spring Session：登录状态留在 MockHttpSession 中，测试不依赖 Redis。
# 只有 RedisSessionTest 把这一项清空，连接 Testcontainers 启动的 Redis（决策 040）
spring.autoconfigure.exclude=org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration

# 每种 @MockitoBean / @TestBean 组合都是一个缓存的 Spring 上下文，各占一个连接池，共用同一个 MySQL 容器。
# 默认每个池 10 个连接，上下文一多就超过 MySQL 的上限（151）
spring.datasource.hikari.maximum-pool-size=3
